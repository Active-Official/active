# cargo-audit configuration (C-064: the `audit` CI job enforces this).
#
# Ignored advisories are accepted risks with an owner and an exit
# condition — never silence by default. Re-evaluate every ignore on
# each MSRV bump and each major dependency upgrade.

[advisories]
ignore = [
    # RUSTSEC-2024-0449 (unsafe-libyaml unmaintained, 2024-03-25,
    # patched=[]): accepted risk - the YAML frontend migration is in
    # progress (LANG-I-004). Owner: Active Language Team. Re-evaluate on a
    # new unsafe-libyaml CVE or the next MSRV bump, whichever is first.
    # Mitigation: the `convert` fuzz target exercises all four importers
    # (YAML included) for 300 s per CI run, and
    # `active-core/tests/yaml_frontend.rs` pins the current frontend's
    # output so a replacement can be differential-tested before shipping.
    "RUSTSEC-2024-0449",
]
