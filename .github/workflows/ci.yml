name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format gate (rustfmt)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check

  active-fmt-check:
    name: Format gate (active fmt --check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --locked -p active-cli
      - name: Canonical brace corpus
        run: target/debug/active fmt --style brace --check tests/fmt/brace/*.active
      - name: Canonical indent corpus
        run: target/debug/active fmt --style indent --check tests/fmt/indent/*.active

  clippy:
    name: Lint gate (clippy -D warnings)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Build + test gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Benches run once (panic gate)
        # LANG-K-002: a benchmark that panics must fail CI here, where the
        # result does not depend on an external upload. `--test` executes
        # every benchmark once, including their assertions, without
        # measuring; criterion exits non-zero on a panic. Regression
        # tracking itself runs in the CodSpeed workflow (LANG-K-004).
        if: runner.os == 'Linux'
        run: |
          cargo bench --workspace --no-run --locked
          cargo bench -p active-core --bench eval --locked -- --test
          cargo bench -p active-core --bench tooling --locked -- --test
          cargo bench -p active-lsp --bench analysis --locked -- --test
      - name: Verify examples evaluate
        shell: bash
        run: |
          cargo run -q -p active-cli -- check examples/demo.active
          cargo run -q -p active-cli -- check examples/complete.active

  msrv:
    name: MSRV gate (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          # `active-core/tests/generate.rs` shells out to rustfmt to prove
          # generated Rust parses; the component is part of the test
          # surface, not an optional developer tool.
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build on declared MSRV
        run: cargo build --workspace --locked
      - name: Run the test suite on declared MSRV
        # LANG-J-004: build-only left the advertised floor unproven for the
        # test workflow; the suite must run on the declared toolchain.
        run: cargo test --workspace --locked

  package:
    name: Packaging gate (C-056)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # LANG-J-008: every crate is published now, so the gate runs the
      # full `cargo package` for all of them (path deps rewrite against
      # the registry). The retired placeholder is asserted absent below.
      - name: Package every crate
        run: |
          cargo package --locked -p active-core
          for p in active active-fmt active-lsp active-cli active-ffi active-wasm; do
            # Dependents' tarballs are built and validated here. Their
            # verification build compiles against the PUBLISHED
            # active-core, which lags this tree until the matching core
            # lands (the release order publishes core first), so
            # --no-verify keeps the gate meaningful without pinning it to
            # an older API. Full verification runs at publish time.
            cargo package --locked --no-verify -p "$p"
          done
      # LANG-E-001 / E-004: the retired active-infinity placeholder must
      # never be packaged from this repository again. The name belongs to
      # the standalone Infinity codec (VERSIONING.md section 4).
      - name: Retired placeholder is never packaged
        run: |
          if [ -e active-infinity ]; then
            echo "::error::active-infinity/ exists; the member is retired (VERSIONING.md section 4)"
            exit 1
          fi
          if grep -q '"active-infinity"' Cargo.toml; then
            echo "::error::active-infinity must not be a workspace member"
            exit 1
          fi
          if cargo metadata --no-deps --format-version 1 | grep -q 'active-infinity'; then
            echo "::error::active-infinity still appears in cargo metadata"
            exit 1
          fi

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        # Pinned like cargo-fuzz (LANG-I-016): an unpinned gate changes
        # its exit-code and advisory behaviour without review.
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit lockfile
        run: cargo audit
      - name: Duplicate dependency report (visibility)
        # LANG-I-006: duplicates are not fatal (most are dev/build-only or
        # required by the crypto stack), but a new one must be visible in
        # the run log at review time instead of discovered by an audit.
        run: cargo tree --duplicates
