name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format gate (rustfmt)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Lint gate (clippy -D warnings)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Build + test gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Verify examples evaluate
        shell: bash
        run: |
          cargo run -q -p solid-cli -- check examples/demo.solid
          cargo run -q -p solid-cli -- check examples/complete.solid

  msrv:
    name: MSRV gate (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build on declared MSRV
        run: cargo build --workspace --locked

  package:
    name: Packaging gate (C-056)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full `cargo package` proves solid-lang-core is publish-ready.
      # Dependents need solid-lang-core on crates.io first (cargo
      # rewrites path deps to registry deps), so they get --list
      # (file inclusion + manifest parse) until the first publish;
      # spec/packaging.md §4 tracks the progression.
      - name: Package solid-lang-core
        run: cargo package --locked -p solid-lang-core
      - name: List dependent packages
        run: |
          cargo package --list --locked -p solid-fmt
          cargo package --list --locked -p solid-ls
          cargo package --list --locked -p solid-cli
