name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format gate (rustfmt)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check

  active-fmt-check:
    name: Format gate (active fmt --check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --locked -p active-cli
      - name: Canonical brace corpus
        run: target/debug/active fmt --style brace --check tests/fmt/brace/*.active
      - name: Canonical indent corpus
        run: target/debug/active fmt --style indent --check tests/fmt/indent/*.active

  clippy:
    name: Lint gate (clippy -D warnings)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Build + test gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Verify examples evaluate
        shell: bash
        run: |
          cargo run -q -p active-cli -- check examples/demo.active
          cargo run -q -p active-cli -- check examples/complete.active

  msrv:
    name: MSRV gate (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build on declared MSRV
        run: cargo build --workspace --locked
      - name: Compile the test suite on declared MSRV
        # The dev-dependencies require the same floor; this is the gate
        # that proves the AGENTS.md `cargo test --workspace` path builds.
        run: cargo test --workspace --no-run --locked

  package:
    name: Packaging gate (C-056)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full `cargo package` proves active-core is publish-ready.
      # Dependents need active-core on crates.io first (cargo
      # rewrites path deps to registry deps), so they get --list
      # (file inclusion + manifest parse) until the first publish;
      # spec/packaging.md §4 tracks the progression.
      - name: Package active-core
        run: cargo package --locked -p active-core
      - name: List dependent packages
        run: |
          cargo package --list --locked -p active-fmt
          cargo package --list --locked -p active-lsp
          cargo package --list --locked -p active-cli
      # LANG-E-001 / E-004: the retired active-infinity placeholder must
      # never be packaged from this repository again. The name belongs to
      # the standalone Infinity codec (VERSIONING.md section 4).
      - name: Retired placeholder is never packaged
        run: |
          if [ -e active-infinity ]; then
            echo "::error::active-infinity/ exists; the member is retired (VERSIONING.md section 4)"
            exit 1
          fi
          if grep -q '"active-infinity"' Cargo.toml; then
            echo "::error::active-infinity must not be a workspace member"
            exit 1
          fi
          if cargo metadata --no-deps --format-version 1 | grep -q 'active-infinity'; then
            echo "::error::active-infinity still appears in cargo metadata"
            exit 1
          fi

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit lockfile
        run: cargo audit
