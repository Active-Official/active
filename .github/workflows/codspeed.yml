name: CodSpeed

# Continuous benchmarking for the C-055 performance contract
# (spec/performance.md): every push/PR runs the criterion suite
# through the CodSpeed runner in simulation mode, which fails on
# significant regression vs the base branch. Local runs use plain
# `cargo bench -p active-core --bench eval` (the compat crate falls
# back to stock criterion outside the runner).
#
# Shape follows the CodSpeed Rust docs exactly: `cargo codspeed
# build`, then the action with `mode: simulation` and
# `run: cargo codspeed run`. Plain `cargo bench` under the action
# does NOT work (the compat crate panics without the runner env).
# OIDC (`id-token: write`) authenticates public repos — no token
# secret needed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks (CodSpeed)
    runs-on: ubuntu-latest
    # A cold runner (no setup-rust cache, or a cache-service outage) can
    # spend most of the budget compiling the benchmark targets; the
    # official-remote run on 66e4fcd hit GitHub's 30-minute ceiling exactly
    # at "cargo codspeed build". 60 minutes leaves room for the build plus
    # the simulation run without licensing a hung job.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed
      - name: Build the benchmark target(s)
        run: cargo codspeed build
      - name: Run benchmarks
        # Regression tracking needs the one-time owner connection at
        # codspeed.io for Active-Official/active (BLOCKS.md). Until that
        # exists the upload returns `401 Unauthorized`, so this step is
        # best-effort. The hard panic gate lives in ci.yml ("Benches run
        # once"), which does not depend on an external service: a broken
        # benchmark still fails CI. Remove this line once the connection
        # is confirmed and the first baseline is recorded.
        continue-on-error: true
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run
