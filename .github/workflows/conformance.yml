name: Conformance

# Shared cross-implementation conformance (CHECKLIST Step 3.001,
# PROPOSAL section 5.1). Runs the harness over Rust, the C ABI, WASM,
# Go, Python, JS, Zig, and C# on every push and PR, plus Tier-2 smoke
# paths where toolchains exist. Codes AND spans compare strictly through
# the differential gate (identical ordered codes, span tuples,
# severities, refused flags, redacted JSON across embeddings); the gate
# itself must pass for the run to pass, and any leak fails the run.
# Tier-2 paths that cannot run here skip openly, never silently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Shared harness (all paths)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install LuaJIT (Unix only)
        if: runner.os != 'Windows'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - name: Install Tier-2 apt toolchains (Linux only)
        # Pinned by the Ubuntu 24.04 (noble) release itself: apt resolves
        # fixed versions within the runner image date, same as the luajit
        # step above. Only fast-moving upstreams get explicit pins below.
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          perl libffi-platypus-perl r-base-core ghc ocaml elixir
          kotlin
      - name: Install Nim via choosenim (Linux only)
        if: runner.os == 'Linux'
        run: curl -fsSL https://nim-lang.org/choosenim/init.sh -o /tmp/choosenim.sh && sh /tmp/choosenim.sh -y -- 2.2.12 && echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
      - name: Install Crystal (Linux only)
        # OBS devel:languages:crystal repo for noble; tracks the stable
        # release like the Dart repo below.
        if: runner.os == 'Linux'
        run: curl -fsSL https://crystal-lang.org/install.sh | sudo bash
      - name: Install Dart (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq apt-transport-https
          curl -fsSL https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/dart.gpg
          echo "deb [signed-by=/usr/share/keyrings/dart.gpg arch=amd64] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main" | sudo tee /etc/apt/sources.list.d/dart_stable.list
          sudo apt-get update -qq && sudo apt-get install -y -qq dart
          echo "/usr/lib/dart/bin" >> "$GITHUB_PATH"
      - name: Install Julia via juliaup (Linux only)
        # Follows the stable release channel; the smoke needs any working
        # toolchain since it drives the frozen C ABI. Proof pins 1.13.2.
        if: runner.os == 'Linux'
        run: curl -fsSL https://install.julialang.org -o /tmp/juliaup && sh /tmp/juliaup -y && echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - name: Install Erlang NIF headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq erlang-dev
      # Swift and V are container-proven only. Swift's 1 GB download is not
      # worth every CI run, and V builds from source upstream (no stable
      # tags; the CI smoke compile stalled the step past 900s while the
      # identical proof passes in seconds in the Tier-2 container).
      # bindings/swift and bindings/vlang run-smoke.py skip openly without
      # swiftc/v; proof lives in the Tier-2 container logs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Python WASM runtime
        run: pip install wasmtime
      - name: Build WASM module and FFI libraries
        run: cargo build -p active-wasm --target wasm32-unknown-unknown --release --locked
      - run: cargo build -p active-ffi --locked
      - name: Run harness unit tests (gate enforcement)
        # test_run.py pins the parity rules inside run.py: weakening
        # classify()/verify_parity() must turn these red. Runs before the
        # shared harness so a weakened gate never reports green.
        run: python conformance/harness/test_run.py
      - name: Run shared harness
        run: python conformance/harness/run.py --out harness.json
      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.os }}
          path: harness.json
