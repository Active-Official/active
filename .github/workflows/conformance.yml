name: Conformance

# Shared cross-implementation conformance (CHECKLIST Step 3.001,
# PROPOSAL section 5.1). Runs the harness over Rust, the C ABI, WASM,
# Go, Python, JS, Zig, and C# on every push and PR, plus Tier-2 smoke
# paths where toolchains exist. Codes AND spans compare strictly through
# the differential gate (identical ordered codes, span tuples,
# severities, refused flags, redacted JSON across embeddings); the gate
# itself must pass for the run to pass, and any leak fails the run.
# Tier-2 paths that cannot run here skip openly, never silently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Shared harness (all paths)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install LuaJIT (Unix only)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          timeout 120 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update -qq \
          && timeout 300 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y -qq luajit
      - name: Install Tier-2 apt toolchains (Linux only)
        # Distro packages from the runner's own mirrors. `sudo -E` is
        # ignored on these runners, so the non-interactive frontend is
        # passed with `sudo env`; without it dpkg blocks on a tzdata or
        # needrestart prompt (observed: 25 minutes of silence, then the
        # step timeout). Boot-time unattended-upgrades is stopped because
        # it can hold the dpkg lock. Every attempt is bounded by
        # `timeout`, and the next step verifies each toolchain, so a
        # silent partial install cannot reach the harness as a SKIP.
        if: runner.os == 'Linux'
        timeout-minutes: 45
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          echo "disk before:"; df -h / | tail -n 1
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get clean
          sudo systemctl stop unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo systemctl disable unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          apt_flags="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold -o Dpkg::Use-Pty=0"
          timeout 300 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get $apt_flags update -q || true
          # One group at a time, each with its own bound and retry. A slow
          # or stalled download then fails inside its group instead of
          # consuming the whole step, and the groups that already installed
          # stay installed for the next attempt.
          rc=0
          for group in "perl libffi-platypus-perl" "r-base-core" "ghc" "ocaml" "elixir" "kotlin"; do
            ok=0
            for attempt in 1 2; do
              echo "::group::apt $group attempt $attempt"
              if timeout 900 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
                   apt-get $apt_flags install -y -q --no-install-recommends $group; then
                ok=1
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              echo "apt group '$group' attempt $attempt failed or timed out"
              sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a dpkg --configure -a || true
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::apt group '$group' failed after two attempts"
              rc=1
            fi
          done
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get clean
          echo "disk after:"; df -h / | tail -n 1
          exit $rc
      - name: Verify Tier-2 apt toolchains (Linux only)
        # A missing toolchain must fail here, not become a SKIP later.
        if: runner.os == 'Linux'
        run: |
          perl -e 'use FFI::Platypus; print "perl+FFI::Platypus ok\n"'
          R --version | head -n 1
          ghc --version
          ocaml -version
          elixir --version | tail -n 1
          kotlinc -version 2>&1 | head -n 1
      - name: Install Julia from the pinned tarball (Linux only)
        # juliaup's metadata DB and the runner's apt index both proved
        # unreliable; a pinned official tarball is deterministic and
        # needs no registry. Required: no SKIP.
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 300 curl -fsSL --retry 3 \
                 https://julialang-s3.julialang.org/bin/linux/x64/1.11/julia-1.11.5-linux-x86_64.tar.gz \
                 -o /tmp/julia.tar.gz \
               && sudo mkdir -p /opt/julia \
               && sudo tar -xzf /tmp/julia.tar.gz -C /opt/julia --strip-components=1 \
               && /opt/julia/bin/julia --version; then
              echo "/opt/julia/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "julia tarball attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - name: Install Nim from the pinned tarball (Linux only)
        # choosenim's network bootstrap was slow and flaky; the pinned
        # linux_x64 tarball is deterministic. Required: no SKIP.
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 300 curl -fsSL --retry 3 \
                 https://nim-lang.org/download/nim-2.2.4-linux_x64.tar.xz \
                 -o /tmp/nim.tar.xz \
               && sudo mkdir -p /opt/nim \
               && sudo tar -xJf /tmp/nim.tar.xz -C /opt/nim --strip-components=1 \
               && /opt/nim/bin/nim --version; then
              echo "/opt/nim/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "nim tarball attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - name: Install Crystal (Linux only)
        # OBS devel:languages:crystal repo for noble; tracks the stable
        # release like the Dart repo below. Required (no skip); retry the
        # upstream installer on transient network failures.
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 120 curl -fsSL https://crystal-lang.org/install.sh -o /tmp/crystal-install.sh \
               && timeout 600 sudo bash /tmp/crystal-install.sh \
               && crystal --version; then
              exit 0
            fi
            echo "crystal installer attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - name: Install Dart (Linux only)
        # Required (no skip); retry the repository setup and package
        # install on transient network failures. Non-interactive dpkg:
        # the Dart package pulls a JRE-free set but apt can still prompt.
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          for attempt in 1 2 3; do
            if sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
                 apt-get install -y -qq apt-transport-https \
               && timeout 60 curl -fsSL https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/dart.gpg \
               && echo "deb [signed-by=/usr/share/keyrings/dart.gpg arch=amd64] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main" | sudo tee /etc/apt/sources.list.d/dart_stable.list >/dev/null \
               && timeout 600 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update -qq \
               && timeout 900 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y -qq dart \
               && /usr/lib/dart/bin/dart --version; then
              echo "/usr/lib/dart/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "dart installer attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - name: Verify Tier-2 tarball and installer toolchains (Linux only)
        # Every required Linux toolchain must be on PATH here. A missing
        # one fails the job now instead of skipping a harness path later.
        if: runner.os == 'Linux'
        run: |
          julia --version
          nim --version | head -n 1
          crystal --version | head -n 1
          dart --version
      - name: Install Erlang NIF headers (Linux only)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: timeout 300 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y -qq erlang-dev
      # Swift and V are container-proven only. Swift's 1 GB download is not
      # worth every CI run, and V builds from source upstream (no stable
      # tags; the CI smoke compile stalled the step past 900s while the
      # identical proof passes in seconds in the Tier-2 container).
      # bindings/swift and bindings/vlang run-smoke.py skip openly without
      # swiftc/v; proof lives in the Tier-2 container logs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Python WASM runtime
        run: pip install wasmtime
      - name: Build WASM module and FFI libraries
        run: cargo build -p active-wasm --target wasm32-unknown-unknown --release --locked
      - run: cargo build -p active-ffi --locked
      - name: Run harness unit tests (gate enforcement)
        # test_run.py pins the parity rules inside run.py: weakening
        # classify()/verify_parity() must turn these red. Runs before the
        # shared harness so a weakened gate never reports green.
        run: python conformance/harness/test_run.py
      - name: Run differential helper unit tests
        # test_diff_vectors.py pins the comparison helpers (sorted-set
        # view, scrubbing, pin loading) used by the differential gate.
        run: python conformance/harness/test_diff_vectors.py
      - name: Run harness self-check (tally parser guard)
        # Guards the tally parser itself: a regex matching failure output
        # (or missing everything) turns this red. Manual-only before;
        # now part of CI.
        run: python conformance/harness/run.py --self-check
      - name: Run shared harness
        run: python conformance/harness/run.py --out harness.json
      - name: Install codegen validator deps
        run: pip install jsonschema==4.26.0
      - name: Run codegen equivalence check
        # Per-target validation-equivalence (jsonschema accept/reject,
        # tsc --strict + zod runtime accept/reject, gofmt + go vet +
        # validate tags, python import) plus byte-stability (determinism)
        # and version stamps on every generation.
        run: python conformance/evidence/codegen_check.py
      - name: Build CLI for output-schema checks
        run: cargo build -p active-cli --locked
      - name: Validate tooling JSON outputs against committed schemas
        # Every machine-readable emitter (graph, taint, budget, inspect,
        # mode, lint, repair plan, debug steps) is validated against
        # docs/schemas/*.json, so an output shape change fails here.
        run: python conformance/evidence/output_schema_check.py
      - name: Editor smoke (VS Code extension + Neovim layer)
        # Activates the real extension against a stubbed VS Code API and
        # probes redaction through the same CLI it calls; the Neovim
        # check SKIPs openly when no Lua toolchain is installed.
        run: |
          node editors/vscode/scripts/smoke.js
          python editors/neovim/smoke.py
      - name: Run agent-kit eval (reference loops)
        # Hard gate: all three reference loops must converge identically
        # (same clean verdicts, iterations, and codes per task) with a
        # positive improvement count and zero secret leakage.
        run: python agent-kit/eval/test_capability.py && python agent-kit/interchange/test_short_circuit.py && python agent-kit/eval/run.py --out agentkit-eval.json
      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.os }}
          path: |
            harness.json
            agentkit-eval.json
          retention-days: 30

  tooling:
    name: Tooling suite (LSP, inspector, debugger, viz, editor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Language server + CLI suites
        run: |
          cargo test -p active-lsp --locked
          cargo test -p active-cli --locked
      - name: Tooling core suites
        run: cargo test -p active-core --locked --test lint --test inspect --test viz --test debug --test repair --test capability
      - name: Output schema and editor smoke
        run: |
          cargo build -p active-cli --locked
          python -m pip install jsonschema==4.26.0
          python conformance/evidence/output_schema_check.py
          node editors/vscode/scripts/smoke.js
          python editors/neovim/smoke.py
          python packaging/test_package_neovim.py

  fuzz:
    name: Tooling fuzz (bounded cargo-fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build
      - name: Fuzz lexer, parser, and interpolation (bounded)
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run lexer -- -max_total_time=20
          cargo +nightly fuzz run parser -- -max_total_time=20
          cargo +nightly fuzz run interpolation -- -max_total_time=20
