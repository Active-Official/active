name: Docs

# Documentation site (C-060/C-061): mdBook builds every push and PR.
# The build validates SUMMARY links and {{#include}} sample paths;
# the .solid samples themselves are executed by the docs_site test
# target, so the book cannot rot. Hosting is a one-time human step
# (repo Settings → Pages → deploy from gh-pages branch, then add an
# upload + peaceiris/actions-gh-pages deploy job here); until then
# the built site ships as a CI artifact.
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mdBook site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.4.52
      - name: Build
        working-directory: docs-site
        run: mdbook build
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site/book
