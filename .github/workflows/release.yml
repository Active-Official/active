name: Release

# Official binaries + crates.io + editor artifacts (C-056/C-057,
# spec/packaging.md). Tags `v*` cut a release; manual dispatch
# validates the full matrix without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Tags publish irreversibly (crates.io versions cannot be
  # overwritten): never auto-cancel a tag run. Manual dispatches
  # still cancel superseded runs.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binaries
        shell: bash
        run: cargo build --release --locked -p active-cli -p active-fmt -p active-lsp --target ${{ matrix.target }}
      - name: Verify examples evaluate (except cross-compiled macOS leg)
        if: ${{ matrix.target != 'x86_64-apple-darwin' }}
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/active"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then BIN="$BIN.exe"; fi
          "$BIN" check examples/demo.active
          "$BIN" check examples/complete.active
      - name: Stage archive
        shell: bash
        run: |
          STAGE="active-${{ matrix.target }}"
          mkdir -p "$STAGE"
          EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then EXT=".exe"; fi
          for tool in active active-fmt active-lsp; do
            cp "target/${{ matrix.target }}/release/$tool$EXT" "$STAGE/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          cp -r schemas "$STAGE/schemas"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "$STAGE.zip" "$STAGE"
          else
            tar czf "$STAGE.tar.gz" "$STAGE"
          fi
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: active-${{ matrix.target }}
          path: active-${{ matrix.target }}.*

  wasm:
    name: Build WASM bundle + conformance archive (C-004)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build wasm release
        run: cargo build --locked -p active-wasm --target wasm32-unknown-unknown --release
      - name: Setup node for conformance run
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conformance against released-shape wasm
        shell: bash
        run: node active-wasm/run-conformance.js target/wasm32-unknown-unknown/release/active_wasm.wasm
      - name: Stage dist bundle
        # Zero-import module (G-003): ship the raw .wasm plus the
        # hand-written JS/TS shim. No wasm-bindgen glue exists or is
        # needed: plain WebAssembly.instantiate suffices, and the
        # pinned CLI rejects non-bindgen modules.
        shell: bash
        run: |
          mkdir -p dist-wasm
          cp target/wasm32-unknown-unknown/release/active_wasm.wasm dist-wasm/
          cp active-wasm/js/active-shim.js active-wasm/js/active-shim.d.ts dist-wasm/
          tar czf dist-wasm/active-conformance.tar.gz conformance
          ls dist-wasm
      - name: Upload wasm bundle
        uses: actions/upload-artifact@v4
        with:
          name: active-wasm
          path: dist-wasm/*

  vsix:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Install vsce and package
        working-directory: editors/vscode
        run: |
          npm install -g @vscode/vsce
          vsce package
      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: active-vsix
          path: editors/vscode/*.vsix

  release:
    name: Publish release
    needs: [build, vsix, wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build signer binary
        run: cargo build --locked -p active-cli
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SBOMs (CycloneDX)
        # Same tool/procedure as the committed packaging/sboms/
        # snapshot (cargo-cyclonedx 0.5.9). Release copies land in
        # dist/ with release-scoped names and join checksums,
        # attestations, and the release upload below.
        shell: bash
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.9
          cargo cyclonedx --all -f json
          shopt -s nullglob
          for f in active/active.cdx.json active-*/active*.cdx.json; do
            base=$(basename "$f" .cdx.json)
            mv "$f" "dist/active-sbom-${base}.cdx.json"
          done
          count=$(ls dist/active-sbom-*.cdx.json | wc -l)
          test "$count" -eq 8 || { echo "FAIL: expected 8 SBOMs, got $count"; exit 1; }
          ls dist/active-sbom-*.cdx.json
      - name: Optional active-sign sidecars
        # RELEASE_SIGNING_KEY holds the `.secret` file text from
        # `active keygen` (written to a file: --key takes a path, not
        # hex). Sidecars record kid "active-release"; verify against a
        # trust file with id "active-release" + the release public key.
        # Gated in-shell (not `if: secrets...`, which the dispatcher
        # rejects): absent key skips quietly, branch stays green.
        # Runs BEFORE checksums so sidecars are checksummed with every
        # other release file (key-based authenticity; provenance
        # attests the build outputs — see the trust split below).
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no release key configured; skipping signatures"
            exit 0
          fi
          echo "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.key"
          cd dist
          for f in active-*.tar.gz active-*.zip active-lang-*.vsix; do
            "$GITHUB_WORKSPACE/target/debug/active" sign --key "$RUNNER_TEMP/release.key" --kid active-release "$f"
          done
          rm -f "$RUNNER_TEMP/release.key"
          ls *.sig
      - name: Checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          files=(active-*.tar.gz active-*.zip active-lang-*.vsix active_wasm.wasm active-conformance.tar.gz active-sbom-*.cdx.json *.sig)
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        # Trust split, documented: provenance attests the build outputs
        # (archives, wasm, conformance, SBOMs). Optional `.sig`
        # sidecars carry key-based authenticity instead and are pinned
        # by SHA256SUMS above (nullglob: identical with or without a
        # release key configured).
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/active-*.tar.gz
            dist/active-*.zip
            dist/active-lang-*.vsix
            dist/active_wasm.wasm
            dist/active-conformance.tar.gz
            dist/active-sbom-*.cdx.json
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Active ${{ github.ref_name }} — see spec/packaging.md §6 for install
            and verification (SHA256SUMS, build attestations, `.sig` sidecars
            when the release key is set).
      - name: Publish crates (needs CARGO_REGISTRY_TOKEN or trusted publishing)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "no registry token and no trusted-publishing link; skipping crates.io publish"
            exit 0
          fi
          cargo login "$CARGO_REGISTRY_TOKEN"
          # Registry index lag breaks dependents published back to
          # back: lock files, publish in dependency order, pause
          # between crates. active-ffi and active-wasm ride the unified
          # track; active-infinity stays manual (independent 1.0.0 track).
          for p in active-core active active-fmt active-lsp active-cli active-ffi active-wasm; do
            cargo publish --locked -p "$p"
            sleep 60
          done
