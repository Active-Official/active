name: Release

# Official binaries + crates.io + editor artifacts (C-056/C-057,
# spec/packaging.md). Tags `v*` cut a release; manual dispatch
# validates the full matrix without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Tags publish irreversibly (crates.io versions cannot be
  # overwritten): never auto-cancel a tag run. Manual dispatches
  # still cancel superseded runs.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binaries
        shell: bash
        run: cargo build --release --locked -p active-cli -p active-fmt -p active-lsp --target ${{ matrix.target }}
      - name: Verify examples evaluate
        # The x86_64 macOS leg is cross-compiled on an arm64 runner; run
        # it under Rosetta so the shipped binary is executed, never assumed
        # (LANG-H-001).
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-apple-darwin" ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license
            RUN=(arch -x86_64)
          else
            RUN=()
          fi
          BIN="target/${{ matrix.target }}/release/active"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then BIN="$BIN.exe"; fi
          "${RUN[@]}" "$BIN" check examples/demo.active
          "${RUN[@]}" "$BIN" check examples/complete.active
      - name: Stage archive
        shell: bash
        run: |
          STAGE="active-${{ matrix.target }}"
          mkdir -p "$STAGE"
          EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then EXT=".exe"; fi
          for tool in active active-fmt active-lsp; do
            cp "target/${{ matrix.target }}/release/$tool$EXT" "$STAGE/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          cp -r schemas "$STAGE/schemas"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "$STAGE.zip" "$STAGE"
          else
            tar czf "$STAGE.tar.gz" "$STAGE"
          fi
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: active-${{ matrix.target }}
          path: active-${{ matrix.target }}.*

  wasm:
    name: Build WASM bundle + conformance archive (C-004)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build wasm release
        run: cargo build --locked -p active-wasm --target wasm32-unknown-unknown --release
      - name: Setup node for conformance run
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conformance against released-shape wasm
        shell: bash
        run: node active-wasm/run-conformance.js target/wasm32-unknown-unknown/release/active_wasm.wasm
      - name: Stage dist bundle
        # Zero-import module (G-003): ship the raw .wasm plus the
        # hand-written JS/TS shim. No wasm-bindgen glue exists or is
        # needed: plain WebAssembly.instantiate suffices, and the
        # pinned CLI rejects non-bindgen modules.
        shell: bash
        run: |
          mkdir -p dist-wasm
          cp target/wasm32-unknown-unknown/release/active_wasm.wasm dist-wasm/
          cp active-wasm/js/active-shim.js active-wasm/js/active-shim.d.ts dist-wasm/
          tar czf dist-wasm/active-conformance.tar.gz conformance
          ls dist-wasm
      - name: Stage the playground engine
        # LANG-G-023: the published playground must ship with its engine.
        # Copy from the SAME dist-wasm bundle (one wasm build path; no
        # second artifact), verify byte equality, then package the page
        # with the shim and the verified engine so a release download is
        # runnable as extracted.
        shell: bash
        run: |
          cp dist-wasm/active_wasm.wasm playground/active_wasm.wasm
          cmp dist-wasm/active_wasm.wasm playground/active_wasm.wasm
          rm -rf playground-bundle
          mkdir -p playground-bundle/playground playground-bundle/active-wasm/js
          cp -R playground/. playground-bundle/playground/
          cp active-wasm/js/active-shim.js playground-bundle/active-wasm/js/
          tar czf dist-wasm/active-playground.tar.gz -C playground-bundle playground active-wasm
          tar tzf dist-wasm/active-playground.tar.gz
          ls dist-wasm
      - name: Upload wasm bundle
        uses: actions/upload-artifact@v4
        with:
          name: active-wasm
          path: dist-wasm/*

  vsix:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Install vsce and package
        working-directory: editors/vscode
        run: |
          npm install -g @vscode/vsce
          vsce package
      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: active-vsix
          path: editors/vscode/*.vsix

  neovim:
    name: Package Neovim plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic plugin archive
        run: python packaging/package-neovim.py --out dist
      - name: Upload Neovim plugin
        uses: actions/upload-artifact@v4
        with:
          name: active-neovim
          path: dist/active-neovim-*.tar.gz

  release:
    name: Publish release
    needs: [build, vsix, wasm, neovim]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Publishing waits 60 s between crates for index lag (6 gaps = 6 min)
    # on top of two cargo installs, the signer build, and the upload; a
    # 10-minute cap would cancel the job mid-loop and leave a partial
    # registry state.
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The provenance gate resolves the tag commit; a depth-1 clone
          # may not carry the tag ref, which would fail a legitimate tag
          # closed.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build signer binary
        run: cargo build --locked -p active-cli
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build documentation bundle
        # The docs site is part of the tooling deliverable: build it from
        # the same tree and ship the HTML as a release artifact.
        run: |
          cargo install mdbook --locked --version 0.4.52
          mdbook build docs-site
          tar czf dist/active-docs.tar.gz -C docs-site book
          ls dist/active-docs.tar.gz
      - name: Generate SBOMs (CycloneDX)
        # Same tool/procedure as the committed packaging/sboms/
        # snapshot (cargo-cyclonedx 0.5.9). Release copies land in
        # dist/ with release-scoped names and join checksums,
        # attestations, and the release upload below.
        shell: bash
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.9
          cargo cyclonedx --all -f json
          shopt -s nullglob
          for f in active/active.cdx.json active-*/active*.cdx.json; do
            base=$(basename "$f" .cdx.json)
            mv "$f" "dist/active-sbom-${base}.cdx.json"
          done
          count=$(ls dist/active-sbom-*.cdx.json | wc -l)
          test "$count" -eq 7 || { echo "FAIL: expected 7 SBOMs (the seven published crates; the active-infinity placeholder retired), got $count"; exit 1; }
          ls dist/active-sbom-*.cdx.json
      - name: Optional active-sign sidecars
        # RELEASE_SIGNING_KEY holds the `.secret` file text from
        # `active keygen` (written to a file: --key takes a path, not
        # hex). Sidecars record kid "active-release"; verify against a
        # trust file with id "active-release" + the release public key.
        # Gated in-shell (not `if: secrets...`, which the dispatcher
        # rejects): absent key skips quietly, branch stays green.
        # Runs BEFORE checksums so sidecars are checksummed with every
        # other release file (key-based authenticity; provenance
        # attests the build outputs — see the trust split below).
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no release key configured; skipping signatures"
            exit 0
          fi
          echo "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.key"
          cd dist
          for f in active-*.tar.gz active-*.zip active-lang-*.vsix; do
            "$GITHUB_WORKSPACE/target/debug/active" sign --key "$RUNNER_TEMP/release.key" --kid active-release "$f"
          done
          rm -f "$RUNNER_TEMP/release.key"
          ls *.sig
      - name: Checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          files=(active-*.tar.gz active-*.zip active-lang-*.vsix active_wasm.wasm active-shim.js active-shim.d.ts active-conformance.tar.gz active-playground.tar.gz active-docs.tar.gz active-sbom-*.cdx.json *.sig)
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        # Trust split, documented: provenance attests the build outputs
        # (archives, wasm, conformance, SBOMs). Optional `.sig`
        # sidecars carry key-based authenticity instead and are pinned
        # by SHA256SUMS above (nullglob: identical with or without a
        # release key configured).
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/active-*.tar.gz
            dist/active-*.zip
            dist/active-lang-*.vsix
            dist/active_wasm.wasm
            dist/active-shim.js
            dist/active-shim.d.ts
            dist/active-conformance.tar.gz
            dist/active-docs.tar.gz
            dist/active-sbom-*.cdx.json
      - name: Provenance gate (LANG-J-001)
        # A published version must have a committed source: a clean tree at
        # the tag's commit whose workspace version equals the tag. 0.1.0
        # was published from an uncommitted tree; this gate makes that
        # impossible next time.
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is dirty; a release must come from committed source"
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n1 "${GITHUB_REF_NAME}")"
          if [ "$head_sha" != "$tag_sha" ]; then
            echo "::error::HEAD $head_sha is not the commit of tag ${GITHUB_REF_NAME} ($tag_sha)"
            exit 1
          fi
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print([p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "active-core"][0])')"
          want="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$want" ]; then
            echo "::error::workspace version $version does not match tag $want"
            exit 1
          fi
          echo "provenance: $version at $head_sha"
      - name: Publish crates (fails loudly if unavailable)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          # Publish gate (LANG-J-012): a release run must NEVER silently
          # skip crates.io. Trusted publishing needs no token; the token
          # path is the fallback. If neither is available the job FAILS
          # loudly so the tag is visibly incomplete (never exit 0 here).
          # Publishing itself still requires explicit owner approval
          # (AGENTS.md) — this gate only refuses to half-ship a release.
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo login "$CARGO_REGISTRY_TOKEN"
          fi
          # Registry index lag breaks dependents published back to
          # back: lock files, publish in dependency order, pause
          # between crates. active-ffi and active-wasm ride the unified
          # track. There is no active-infinity publish from this repo: the
          # member is retired (LANG-E-001, VERSIONING.md section 4) and the
          # name belongs to the standalone Infinity codec.
          for p in active-core active active-fmt active-lsp active-cli active-ffi; do
            cargo publish --locked -p "$p"
            sleep 60
          done
          # The last crate needs no pause after it: the job can finish.
          cargo publish --locked -p active-wasm
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Active ${{ github.ref_name }} — see spec/packaging.md §6 for install
            and verification (SHA256SUMS, build attestations, `.sig` sidecars
            when the release key is set).
