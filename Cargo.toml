[workspace]
resolver = "2"
members = [
    "active",
    "active-core",
    "active-cli",
    "active-fmt",
    "active-lsp",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Active Language Team"]
repository = "https://github.com/Active-Official/active"
homepage = "https://github.com/Active-Official/active"
documentation = "https://github.com/Active-Official/active"
description = "Active - Symmetric, Overlay-ready, Loop-proof, Intent-driven, Deterministic configuration language"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = { version = "2.2", features = ["serde"] }
thiserror = "1.0"
regex = "1.11"
anyhow = "1.0"
petgraph = "0.6"
clap = { version = "4.5", features = ["derive"] }
# Version is duplicated from [workspace.package] (cargo forbids
# version.workspace here): keep in sync — the packaging test pins it.
active-core = { version = "1.0.0", path = "active-core" }
