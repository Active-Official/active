[workspace]
resolver = "2"
members = [
    "solid-core",
    "solid-cli",
    "solid-fmt",
    "solid-ls",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["SOLID Language Team"]
repository = "https://github.com/RatioArtificiosa/solid-lang"
description = "SOLID - Symmetric, Overlay-ready, Loop-proof, Intent-driven, Deterministic configuration language"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.2", features = ["serde"] }
thiserror = "1.0"
regex = "1.11"
anyhow = "1.0"
petgraph = "0.6"
clap = { version = "4.5", features = ["derive"] }
