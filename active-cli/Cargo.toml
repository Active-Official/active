[package]
name = "active-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Command-line interface for the Active configuration and data language"
readme = "README.md"
keywords = ["configuration", "language", "cli", "command-line", "dsl"]
categories = ["command-line-utilities", "config"]

[[bin]]
name = "active"
path = "src/main.rs"

[dependencies]
active-core = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
# SIGPIPE disposition (LANG-H-007): Rust ignores it at startup, so a
# closed stdout reader would panic instead of dying silently like every
# standard Unix filter.
libc = "0.2"

[dev-dependencies]
# The L-P62 conformance vector manifest is TOML and deserialized with
# derive; tests are the only consumer in this crate.
serde = { workspace = true }


[lints]
workspace = true
