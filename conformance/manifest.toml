# Cross-table/dotted references (LANG-A-002): a nested table reads a root
# key, and a dotted path reads a key from a named table.
[[cases]]
id = "0029-dotted-cross-table"
file = "cases/0029-dotted-cross-table.active"
kind = "clean"

# Same-line second statement (LANG-A-005, W015): both keys are kept and the
# warning is published by every embedding.
[[cases]]
id = "0030-same-line-statement"
file = "cases/0030-same-line-statement.active"
kind = "diagnosed"

# A profile may not rewrite document metadata (LANG-A-009, E027):
# active_mode/active_capabilities are read before profiles merge.
[[cases]]
id = "0031-profile-metadata-rewrite"
file = "cases/0031-profile-metadata-rewrite.active"
kind = "refused"

# The shared diagnostic budget (LANG-A-001/A-901): 1,100 duplicate keys
# retain exactly 1,024 records, closed by the single W014 truncation notice.
# The committed expectation is the sorted set {W011, W014}; the differential
# gate still compares the ordered per-item list across embeddings.
[[cases]]
id = "0032-diagnostic-truncation"
file = "cases/0032-diagnostic-truncation.active"
kind = "diagnosed"

# A lexer error flood (LANG-A-001 class): 1,200 detached invalid characters
# hit the lexer's own cap. The parser must surface W014 in the returned error
# list, so every embedding reports a truncated list that says it was cut.
[[cases]]
id = "0033-lexer-error-truncation"
file = "cases/0033-lexer-error-truncation.active"
kind = "refused"

# LANG-F-004: the taint claim describes the PAYLOAD. A secret elsewhere in
# the document must not reject a clean payload.
[[cases]]
id = "0034-envelope-unrelated-secret"
file = "cases/0034-envelope-unrelated-secret.active"
kind = "clean"

# The envelope field table marks `tainted` required: a missing claim cannot
# be verified and fails closed (E035).
[[cases]]
id = "0035-envelope-missing-taint"
file = "cases/0035-envelope-missing-taint.active"
kind = "refused"

# A present but non-boolean claim is malformed, not silently ignored (E035).
[[cases]]
id = "0036-envelope-malformed-taint"
file = "cases/0036-envelope-malformed-taint.active"
kind = "refused"

# Host-feature pins (G-017 spirit): cases needing capabilities a v1 host
# shim does not expose. Runners record these as pins with reason, never as
# failures and never silently. Removing a pin means the host grew the
# capability plus a passing run to prove it.
[[pins]]
id = "0008-include"
reason = "include-loader callback absent from shim v1 (F-016 native only)"

[[pins]]
id = "0011-profile"
reason = "CLI --profile override absent from shim v1 (in-doc selection covered by 0013-profile-inline)"
# L-P06: an inline content pin makes the importing document
# self-describing; a matching digest resolves the include (clean).
[[cases]]
id = "0037-include-inline-pin"
file = "cases/0037-include-inline-pin.active"
kind = "clean"

# The pinned bytes change: refusing is the whole point of the pin (E041).
[[cases]]
id = "0038-include-inline-pin-mismatch"
file = "cases/0038-include-inline-pin-mismatch.active"
kind = "refused"

[[pins]]
id = "0037-include-inline-pin"
reason = "include-loader callback absent from shim v1 (F-016 native only)"

[[pins]]
id = "0038-include-inline-pin-mismatch"
reason = "include-loader callback absent from shim v1 (F-016 native only)"

# L-T06: v2 envelope with a receipt and a sender identity is accepted.
[[cases]]
id = "0039-envelope-v2"
file = "cases/0039-envelope-v2.active"
kind = "clean"

# A v2 envelope without its required receipt is refused before evaluation.
[[cases]]
id = "0040-envelope-v2-no-receipt"
file = "cases/0040-envelope-v2-no-receipt.active"
kind = "refused"

# L-P19: a root-schema cross-field check passes on the evaluated tree.
[[cases]]
id = "0041-schema-check-pass"
file = "cases/0041-schema-check-pass.active"
kind = "clean"

# A false cross-field check is refused with T009.
[[cases]]
id = "0042-schema-check-fail"
file = "cases/0042-schema-check-fail.active"
kind = "refused"

# L-P09: two includes at the same priority disagree on a value.
[[cases]]
id = "0047-include-merge-conflict"
file = "cases/0047-include-merge-conflict.active"
kind = "refused"

# Equal values from two includes agree (no conflict).
[[cases]]
id = "0048-include-merge-equal"
file = "cases/0048-include-merge-equal.active"
kind = "clean"

# L-P09 include-merge vectors need the native include loader (same pin
# reason as 0008); the reference core suite still exercises them.
[[pins]]
id = "0047-include-merge-conflict"
reason = "include-loader callback absent from shim v1 (F-016 native only)"

[[pins]]
id = "0048-include-merge-equal"
reason = "include-loader callback absent from shim v1 (F-016 native only)"

# L-P09 phase 3: repeated headers merge tables at Local priority.
[[cases]]
id = "0043-duplicate-header-merge"
file = "cases/0043-duplicate-header-merge.active"
kind = "clean"

# Two repeated headers disagree on the same leaf: E046.
[[cases]]
id = "0044-duplicate-header-conflict"
file = "cases/0044-duplicate-header-conflict.active"
kind = "refused"

# L-P09 phase 4: a profile scalar is the stronger Profile layer.
[[cases]]
id = "0045-profile-override-local"
file = "cases/0045-profile-override-local.active"
kind = "clean"

# Profile and base tables union; the profile's key is added.
[[cases]]
id = "0046-profile-table-union"
file = "cases/0046-profile-table-union.active"
kind = "clean"

# L-P10: requires is a biconditional; a present field with a disabled
# trigger is T010 (the reverse direction of the B-001 excuse).
[[cases]]
id = "0049-requires-disabled-present"
file = "cases/0049-requires-disabled-present.active"
kind = "refused"

# L-P10: a disjunction accepts a value satisfying either branch.
[[cases]]
id = "0050-oneof-string-branch"
file = "cases/0050-oneof-string-branch.active"
kind = "clean"

# L-P10: a value satisfying no branch is T002 and names every branch.
[[cases]]
id = "0051-oneof-reject-all"
file = "cases/0051-oneof-reject-all.active"
kind = "refused"

# L-P10: the default is the weakest disjunct; resilient fills it (W005).
[[cases]]
id = "0052-oneof-default-fill"
file = "cases/0052-oneof-default-fill.active"
kind = "diagnosed"

# L-P10: a default that satisfies no branch is a schema defect (T002).
[[cases]]
id = "0053-oneof-bad-default"
file = "cases/0053-oneof-bad-default.active"
kind = "refused"

# L-P05: `--pure` refusals (E047). Env reads, unpinned includes, and
# host-selected profile overrides are ambient input; a pure document
# evaluates identically with and without the mode.
[[cases]]
id = "0054-pure-env-refused"
file = "cases/0054-pure-env-refused.active"
kind = "refused"
pure = true

[[cases]]
id = "0055-pure-unpinned-include"
file = "cases/0055-pure-unpinned-include.active"
kind = "refused"
pure = true

[[cases]]
id = "0056-pure-profile-override"
file = "cases/0056-pure-profile-override.active"
kind = "refused"
pure = true
profile = "prod"

[[cases]]
id = "0057-pure-identity"
file = "cases/0057-pure-identity.active"
kind = "clean"
pure = true

# The shim harnesses do not expose the pure mode yet (L-P05 follow-up); the
# reference core suite above runs these refusals.
[[pins]]
id = "0054-pure-env-refused"
reason = "pure mode is not exposed by the shim harness yet (L-P05 native only)"

[[pins]]
id = "0055-pure-unpinned-include"
reason = "pure mode is not exposed by the shim harness yet (L-P05 native only)"

[[pins]]
id = "0056-pure-profile-override"
reason = "pure mode is not exposed by the shim harness yet (L-P05 native only)"

# L-P11: closing a table is a promise about keys, never a change to the
# evaluated value; the closed document evaluates to the same payload.
[[cases]]
id = "0058-closed-table-evaluates"
file = "cases/0058-closed-table-evaluates.active"
kind = "clean"
