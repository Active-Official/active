[package]
name = "solid-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
solid-core = { path = "../solid-core" }
libfuzzer-sys = "0.4"

# Standalone workspace: not a member of the root workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1
