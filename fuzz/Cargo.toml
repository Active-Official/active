[package]
name = "active-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
active-core = { path = "../active-core" }
libfuzzer-sys = "0.4"

# Standalone workspace: not a member of the root workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interpolation"
path = "fuzz_targets/interpolation.rs"
test = false
doc = false
bench = false
