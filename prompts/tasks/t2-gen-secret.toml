id = "t2-gen-secret"
system = "generator"
kind = "code"

user = """
Write SOLID for a Postgres database at db.internal:5432, database
"app", user "app", whose password lives in the vault at
prod/db/password.
"""

[[checks]]
type = "parse"

[[checks]]
type = "contains"
text = "secret("

[[checks]]
type = "not_match"
pattern = "password\\s*=\\s*['\"]"

[[checks]]
type = "eval_eq"
path = "database.port"
value = 5432
