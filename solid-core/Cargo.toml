[package]
# crates.io name is scoped: plain `solid-core` belongs to an
# unrelated 2020 crate. The Rust library name stays `solid_core`
# (spec/packaging.md §2), so no code changes with the rename.
name = "solid-lang-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Core parser, IR, evaluator and type system for the SOLID configuration language"
readme = "../README.md"
keywords = ["config", "configuration", "language", "parser", "validation"]
categories = ["parser-implementations", "config"]

[lib]
name = "solid_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
petgraph = { workspace = true }
regex = { workspace = true }
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"

[dev-dependencies]
anyhow = { workspace = true }
proptest = "1"
indexmap = { workspace = true }
criterion = "0.5"
codspeed-criterion-compat = "2"

[[bench]]
name = "eval"
harness = false
