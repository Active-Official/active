[package]
name = "solid-ls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Language Server Protocol implementation for SOLID"
readme = "../README.md"
keywords = ["language-server", "lsp", "config", "language", "ide"]
categories = ["development-tools", "config"]

[[bin]]
name = "solid-ls"
path = "src/main.rs"

[lib]
name = "solid_ls"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
lsp-server = "0.7"
lsp-types = "0.94"
serde_json = { workspace = true }
solid-lang-core = { workspace = true }
